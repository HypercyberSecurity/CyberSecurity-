<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Service - Hyper Team</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050a07;
            background-image: 
                radial-gradient(circle at center, rgba(16, 48, 28, 0.4) 0%, rgba(3, 7, 5, 0.95) 100%),
                repeating-linear-gradient(0deg, rgba(0, 255, 102, 0.03) 0px, rgba(0, 255, 102, 0.03) 1px, transparent 1px, transparent 4px);
            color: #5cff9d;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Status Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #79b892;
            margin-bottom: 25px;
            padding: 0 5px;
        }

        .status-online {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5cff9d;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #5cff9d;
            border-radius: 50%;
            box-shadow: 0 0 8px #5cff9d;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Main Header */
        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 23px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 1.5px;
            color: #6aff9e;
            text-shadow: 0 0 12px rgba(106, 255, 158, 0.5);
            margin-bottom: 25px;
        }

        /* Cyber Panel Box */
        .cyber-panel {
            width: 100%;
            background: rgba(8, 20, 13, 0.85);
            border: 1.5px solid #3c8c5c;
            border-radius: 12px;
            padding: 20px 16px;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.12), inset 0 0 15px rgba(0, 255, 102, 0.08);
            position: relative;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 14px;
        }

        .cyber-input {
            width: 100%;
            background: rgba(4, 12, 8, 0.9);
            border: 1px solid #3a7d54;
            border-radius: 6px;
            padding: 12px 14px;
            color: #88ffba;
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .cyber-input::placeholder {
            color: #6ca884;
            opacity: 0.8;
        }

        .cyber-input:focus {
            border-color: #5cff9d;
            box-shadow: 0 0 12px rgba(92, 255, 157, 0.35);
            background: rgba(10, 28, 18, 0.95);
        }

        textarea.cyber-input {
            resize: none;
            height: 75px;
        }

        /* Service Selection Buttons */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .service-btn {
            background: rgba(6, 16, 10, 0.9);
            border: 1.5px solid #356e4b;
            border-radius: 8px;
            padding: 14px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            color: #7ab893;
            transition: all 0.25s ease;
            user-select: none;
        }

        .service-btn svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .service-btn span {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .service-btn:hover {
            border-color: #5cff9d;
            color: #5cff9d;
        }

        /* Active State (Blue Glow) */
        .service-btn.active {
            background: rgba(10, 35, 65, 0.85);
            border-color: #00bfff;
            color: #4dd2ff;
            box-shadow: 0 0 16px rgba(0, 191, 255, 0.6), inset 0 0 10px rgba(0, 191, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(180deg, rgba(22, 66, 40, 0.9) 0%, rgba(12, 38, 23, 0.95) 100%);
            border: 1.5px solid #4ca871;
            border-radius: 8px;
            color: #88ffba;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(76, 168, 113, 0.25);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(180deg, rgba(30, 88, 54, 0.95) 0%, rgba(16, 52, 31, 1) 100%);
            box-shadow: 0 0 22px rgba(92, 255, 157, 0.5);
            color: #ffffff;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        /* Status Message */
        #form-status {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
            line-height: 1.4;
        }

        /* Footer Branding */
        .footer-brand {
            margin-top: 35px;
            text-align: center;
        }

        .footer-main {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #6aff9e;
            letter-spacing: 1.5px;
            text-shadow: 0 0 14px rgba(106, 255, 158, 0.6);
        }

        .footer-sub {
            font-family: 'Share Tech Mono', monospace;
            font-size: 22px;
            font-weight: 400;
            color: #88ffba;
            letter-spacing: 3px;
            margin-top: 4px;
            text-shadow: 0 0 8px rgba(136, 255, 186, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Terminal Bar -->
        <div class="top-bar">
            <span>sys@cyber:~$ ./request.sh</span>
            <div class="status-online">
                <span class="dot"></span>
                <span>ONLINE</span>
            </div>
        </div>

        <!-- Title -->
        <h1 class="header-title">CYBER SECURITY SERVICE</h1>

        <!-- Main Form -->
        <form id="cyberForm" style="width: 100%;">
            <!-- Selected Service Hidden Field -->
            <input type="hidden" id="selectedService" name="service_type" value="HACK">

            <div class="cyber-panel">
                <div class="input-group">
                    <input type="text" id="nameInput" name="name" class="cyber-input" placeholder="YOUR NAME" required>
                </div>

                <div class="input-group">
                    <input type="text" id="contactInput" name="contact" class="cyber-input" placeholder="YOUR CONTACT NUMBER" required>
                </div>

                <div class="input-group">
                    <textarea id="detailsInput" name="details" class="cyber-input" placeholder="WRITE DETAILS ABOUT YOUR REQUEST HERE" required></textarea>
                </div>

                <!-- 3 Service Buttons -->
                <div class="service-grid">
                    <!-- HACK -->
                    <button type="button" class="service-btn active" data-service="HACK" onclick="selectService(this, 'HACK')">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2a7 7 0 0 0-7 7v4l-2 3h18l-2-3V9a7 7 0 0 0-7-7z"/>
                            <path d="M9 11h.01M15 11h.01M9 15c1.5 1 4.5 1 6 0"/>
                        </svg>
                        <span>HACK</span>
                    </button>

                    <!-- RECOVER -->
                    <button type="button" class="service-btn" data-service="RECOVER" onclick="selectService(this, 'RECOVER')">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <path d="M12 8v8M8 12h8"/>
                        </svg>
                        <span>RECOVER</span>
                    </button>

                    <!-- MONITORING -->
                    <button type="button" class="service-btn" data-service="MONITORING" onclick="selectService(this, 'MONITORING')">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="7"/>
                            <path d="M21 21l-4.35-4.35"/>
                            <path d="M8 12l2-2 2 2 2-3"/>
                        </svg>
                        <span>MONITORING</span>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">SUBMIT SERVICE REQUEST</button>
            <div id="form-status"></div>
        </form>

        <!-- Footer Text -->
        <div class="footer-brand">
            <div class="footer-main">CYBER SECURITY</div>
            <div class="footer-sub">HYPER TEAM</div>
        </div>
    </div>

    <script>
        function selectService(element, serviceName) {
            const buttons = document.querySelectorAll('.service-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            element.classList.add('active');
            document.getElementById('selectedService').value = serviceName;
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGi_Dz2iHQCeaB4-SzwYEVOd4y593886w",
            authDomain: "cybersecurity-56532.firebaseapp.com",
            databaseURL: "https://cybersecurity-56532-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cybersecurity-56532",
            storageBucket: "cybersecurity-56532.firebasestorage.app",
            messagingSenderId: "275545085720",
            appId: "1:275545085720:web:66b017b7d9f88b6649306d",
            measurementId: "G-V9DWQBEB65"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('cyberForm');
        const statusText = document.getElementById('form-status');
        const submitBtn = document.getElementById('submitBtn');
        const nameInput = document.getElementById('nameInput');
        const contactInput = document.getElementById('contactInput');
        const detailsInput = document.getElementById('detailsInput');
        const selectedServiceInput = document.getElementById('selectedService');

        const originalBtnText = submitBtn.innerText;
        const confirmationMessage = "Thank you for submit. Our team member will contact you later.";

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = nameInput.value.trim();
            const contact = contactInput.value.trim();
            const details = detailsInput.value.trim();
            const serviceType = selectedServiceInput.value;

            if (!name || !contact || !details) {
                statusText.style.color = '#ff5c5c';
                statusText.innerText = 'PLEASE FILL OUT ALL REQUIRED FIELDS.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'SENDING...';
            statusText.style.color = '#4dd2ff';
            statusText.innerText = 'ENCRYPTING & SENDING REQUEST...';

            const requestData = {
                name: name,
                contact: contact,
                details: details,
                service_type: serviceType,
                status: 'pending',
                createdAt: serverTimestamp()
            };

            const newRequestRef = push(ref(db, "serviceRequests"));

            const saveWithTimeout = Promise.race([
                set(newRequestRef, requestData),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error("DATABASE_TIMEOUT")), 12000)
                )
            ]);

            try {
                await saveWithTimeout;

                submitBtn.innerText = confirmationMessage;
                statusText.style.color = '#5cff9d';
                statusText.innerText = confirmationMessage;

                form.reset();
                selectedServiceInput.value = 'HACK';

                const defaultBtn = document.querySelector('.service-btn[data-service="HACK"]');
                if (defaultBtn) {
                    selectService(defaultBtn, 'HACK');
                }

                setTimeout(() => {
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }, 4000);
            } catch (error) {
                console.error("Firebase Submit Error:", error);
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
                statusText.style.color = '#ff5c5c';

                if (error.message === "DATABASE_TIMEOUT") {
                    statusText.innerText = 'TIMEOUT: CHECK REALTIME DATABASE & RULES!';
                } else if (error.code === "PERMISSION_DENIED" || (error.message && error.message.toLowerCase().includes("permission"))) {
                    statusText.innerText = 'PERMISSION DENIED: UPDATE DATABASE RULES!';
                } else {
                    statusText.innerText = 'ERROR: ' + (error.message || 'FAILED TO SAVE REQUEST!');
                }
            }
        });
    </script>

</body>
</html
